version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: infra_user
      POSTGRES_PASSWORD: infra_pass
      POSTGRES_DB: infra_care
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg2://infra_user:infra_pass@db:5432/infra_care
    ports:
      - "8000:8000"

volumes:
  db_data:
